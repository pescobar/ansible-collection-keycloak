---
namespace: pescobar
name: keycloak
version: 1.1.0
readme: README.md
authors:
  - pescobar
description: >-
  Deploy and configure Keycloak. Ships two roles: keycloak_deploy (Keycloak +
  Caddy TLS reverse proxy + PostgreSQL via Docker Compose) and keycloak_cfg
  (manage realms, clients, identity providers, keys, authentication and user
  profiles through the Keycloak admin API).
license:
  - MIT
tags:
  - keycloak
  - caddy
  - docker
  - sso
  - iam
  - security
# Collections this one depends on (installed automatically with the collection).
dependencies:
  community.docker: ">=3.0.0"
  # NOT listed on purpose: middleware_automation.keycloak (>=3.1.3) provides the
  # keycloak_* modules keycloak_cfg uses, but the user installs it (see README /
  # requirements.yml).
  # ansible.utils.fact_diff renders the user-profile --diff (uri cannot). Bundled
  # with the ansible community package (ships with ansible 10.x).
  ansible.utils: ">=2.0.0"
repository: https://github.com/pescobar/ansible-collection-keycloak
issues: https://github.com/pescobar/ansible-collection-keycloak/issues
build_ignore:
  - .gitignore
  - .github
  - "*.retry"
  - .vault_pass
