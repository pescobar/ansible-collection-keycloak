---
namespace: pescobar
name: keycloak
version: 1.0.0
readme: README.md
authors:
  - pescobar
description: >-
  Deploy and configure Keycloak. Ships two roles: keycloak_deploy (Keycloak +
  Caddy TLS reverse proxy + PostgreSQL via Docker Compose) and keycloak_configure
  (manage realms, clients and users through the Keycloak admin API).
license:
  - MIT
tags:
  - keycloak
  - caddy
  - docker
  - sso
  - iam
  - security
# Collections this one depends on (installed automatically with the collection).
dependencies:
  community.docker: ">=3.0.0"
  # community.general provides the keycloak_realm/group/client/identity_provider/
  # realm_key modules. >=9.3.0 is the version bundled with ansible 10.3.0; the
  # user profile is NOT applied through a community.general module (see the
  # keycloak_cfg role), so no newer floor is needed.
  community.general: ">=9.3.0"
  # ansible.utils.fact_diff renders the user-profile --diff (uri cannot). Bundled
  # with the ansible community package (ships with ansible 10.x).
  ansible.utils: ">=2.0.0"
repository: https://github.com/pescobar/ansible-collection-keycloak
issues: https://github.com/pescobar/ansible-collection-keycloak/issues
build_ignore:
  - .gitignore
  - .github
  - "*.retry"
  - .vault_pass
