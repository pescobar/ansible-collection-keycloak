---
# Example playbook for the keycloak role.
# Run with: ansible-playbook -i inventory playbook.yml --ask-vault-pass
- name: Deploy Keycloak behind Caddy
  hosts: keycloak
  become: true
  roles:
    - role: ansible-role-keycloak
      vars:
        keycloak_hostname: "auth.example.com"
        keycloak_acme_email: "admin@example.com"
        # Keep these in an Ansible Vault file, not in plain text:
        keycloak_admin_password: "{{ vault_keycloak_admin_password }}"
        keycloak_db_password: "{{ vault_keycloak_db_password }}"
