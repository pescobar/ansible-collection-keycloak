---
# Auxiliary playbook: dump the live configuration of an existing Keycloak realm
# into a YAML vars file structured for the keycloak_cfg role.
#
# It reads the realm, its clients, groups, identity providers (+ mappers), realm
# key providers and declarative user profile through the admin REST API and
# writes them under the keycloak_cfg_* variable names, adding the fields each
# item needs (realm / parent_id / state).
#
# Run (controller-side; talks HTTP to kc_url):
#   ansible-playbook pescobar/keycloak/playbooks/export_realm.yml \
#     -e kc_url=https://auth.example.com \
#     -e kc_realm=myapp \
#     -e kc_admin_password=... \
#     -e kc_export_dest=./myapp-keycloak_cfg.yml
#
# IMPORTANT — the output is a SCAFFOLD to review, not a drop-in:
#   * Secrets are NOT exported: client secrets are dropped (Keycloak 26 returns
#     them in cleartext), IdP secrets and realm-key private keys come back
#     masked. Refill them from Vault before applying.
#   * Values are the raw Keycloak REST representation. Its camelCase keys are
#     mostly accepted as aliases by the middleware_automation.keycloak modules,
#     but it also carries read-only fields they reject (id, access, internalId,
#     subGroupCount, ...), empty values (authenticationFlowBindingOverrides: {})
#     and list-valued component configs (realm keys: priority: ['100']). Prune
#     and reshape before feeding the file back through keycloak_cfg.
- name: Export a Keycloak realm to keycloak_cfg variables
  hosts: "{{ export_host | default('localhost') }}"
  gather_facts: false
  vars:
    kc_url: "https://auth.example.com"
    kc_admin_realm: master
    kc_admin_user: admin
    kc_admin_password: ""
    kc_realm: master
    kc_validate_certs: true
    kc_export_dest: "./{{ kc_realm }}-keycloak_cfg.yml"
    # Clients left out of the export: the built-ins Keycloak creates in every
    # realm. Set to [] to export them too.
    kc_skip_clients:
      - account
      - account-console
      - admin-cli
      - broker
      - realm-management
      - security-admin-console
    _kc_api: "{{ kc_url }}/admin/realms/{{ kc_realm }}"
    _kc_export:
      keycloak_cfg_realms:
        - "{{ _kc_realm.json | combine({'state': 'present'}) }}"
      # Keycloak 26 returns confidential-client secrets in cleartext: drop them.
      keycloak_cfg_clients: >-
        {{ _kc_clients.json
           | rejectattr('clientId', 'in', kc_skip_clients)
           | map('combine', {'realm': kc_realm, 'state': 'present'})
           | map('dict2items') | map('rejectattr', 'key', 'eq', 'secret') | map('list') | map('items2dict')
           | list }}
      keycloak_cfg_groups: "{{ _kc_groups.json | map('combine', {'realm': kc_realm, 'state': 'present'}) | list }}"
      keycloak_cfg_identity_providers: "{{ _kc_idps_with_mappers | default([]) }}"
      keycloak_cfg_realm_keys: "{{ _kc_keys.json | map('combine', {'parent_id': kc_realm, 'state': 'present'}) | list }}"
      keycloak_cfg_user_profiles:
        - realm: "{{ kc_realm }}"
          profile: "{{ _kc_profile.json }}"

  tasks:
    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - kc_url | length > 0
          - kc_realm | length > 0
          - kc_admin_password | length > 0
        fail_msg: "Set kc_url, kc_realm and kc_admin_password (e.g. via -e ...)."
        quiet: true

    - name: Obtain an admin access token
      ansible.builtin.uri:
        url: "{{ kc_url }}/realms/{{ kc_admin_realm }}/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: password
          client_id: admin-cli
          username: "{{ kc_admin_user }}"
          password: "{{ kc_admin_password }}"
        validate_certs: "{{ kc_validate_certs }}"
      register: _kc_token
      no_log: true

    - name: Read the realm configuration
      module_defaults:
        ansible.builtin.uri:
          headers:
            Authorization: "Bearer {{ _kc_token.json.access_token }}"
          validate_certs: "{{ kc_validate_certs }}"
      block:
        - name: Fetch the realm
          ansible.builtin.uri:
            url: "{{ _kc_api }}"
          register: _kc_realm

        - name: Fetch clients
          ansible.builtin.uri:
            url: "{{ _kc_api }}/clients"
          register: _kc_clients

        - name: Fetch groups
          ansible.builtin.uri:
            url: "{{ _kc_api }}/groups"
          register: _kc_groups

        - name: Fetch identity providers
          ansible.builtin.uri:
            url: "{{ _kc_api }}/identity-provider/instances"
          register: _kc_idps

        - name: Fetch identity provider mappers
          ansible.builtin.uri:
            url: "{{ _kc_api }}/identity-provider/instances/{{ item.alias }}/mappers"
          loop: "{{ _kc_idps.json }}"
          loop_control:
            label: "{{ item.alias }}"
          register: _kc_idp_mappers

        - name: Fetch realm key providers
          ansible.builtin.uri:
            url: "{{ _kc_api }}/components?type=org.keycloak.keys.KeyProvider"
          register: _kc_keys

        - name: Fetch the declarative user profile
          ansible.builtin.uri:
            url: "{{ _kc_api }}/users/profile"
          register: _kc_profile

    - name: Attach each identity provider's mappers to it
      ansible.builtin.set_fact:
        _kc_idps_with_mappers: >-
          {{ _kc_idps_with_mappers | default([])
             + [item.item | combine({'realm': kc_realm, 'mappers': item.json, 'state': 'present'})] }}
      loop: "{{ _kc_idp_mappers.results }}"
      loop_control:
        label: "{{ item.item.alias }}"

    - name: Write the keycloak_cfg vars file
      ansible.builtin.copy:
        dest: "{{ kc_export_dest }}"
        mode: "0640"
        content: |
          ---
          # Generated by playbooks/export_realm.yml
          #   source realm : {{ kc_realm }}
          #   source server: {{ kc_url }}
          #
          # SCAFFOLD — review before applying with keycloak_cfg (see the
          # playbook header): secrets are not exported (client secrets dropped,
          # IdP secrets and realm-key private keys masked), and the raw REST
          # representation must be pruned/reshaped for the keycloak_* modules.
          {{ _kc_export | to_nice_yaml(indent=2, width=140) }}

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Wrote {{ kc_export_dest }} from realm '{{ kc_realm }}':
          {{ _kc_export.keycloak_cfg_clients | length }} client(s),
          {{ _kc_export.keycloak_cfg_groups | length }} group(s),
          {{ _kc_export.keycloak_cfg_identity_providers | length }} idp(s),
          {{ _kc_export.keycloak_cfg_realm_keys | length }} key(s).
