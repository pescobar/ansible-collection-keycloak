---
galaxy_info:
  role_name: keycloak_cfg
  author: pescobar
  description: >-
    Configure a running Keycloak instance declaratively through its admin REST
    API: realms, groups, clients, identity providers, realm keys, required
    actions, authentication flows and user profiles. Pairs with keycloak_deploy.
  license: MIT
  min_ansible_version: "2.16"
  galaxy_tags:
    - keycloak
    - sso
    - iam
    - realm
    - oidc

dependencies: []

# Requires the middleware_automation.keycloak collection (keycloak_* modules).
# It is NOT installed automatically: the user installs it (see README).
