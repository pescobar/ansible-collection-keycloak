---
# tasks file for keycloak_cfg

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - keycloak_cfg_url is defined and keycloak_cfg_url | length > 0
      - keycloak_cfg_admin_password is defined and keycloak_cfg_admin_password | length > 0
    fail_msg: >-
      Set keycloak_cfg_url and keycloak_cfg_admin_password before running this
      role (the admin password is empty by default).
    quiet: true

- name: Wait until Keycloak is reachable
  ansible.builtin.uri:
    url: "{{ keycloak_cfg_url }}/realms/{{ keycloak_cfg_admin_realm }}"
    validate_certs: "{{ keycloak_cfg_validate_certs }}"
    status_code: 200
  register: _keycloak_cfg_ready
  until: _keycloak_cfg_ready.status == 200
  retries: "{{ (keycloak_cfg_wait_timeout | int // 10) | int }}"
  delay: 10

- name: Manage realms
  community.general.keycloak_realm:
  args: "{{ _keycloak_cfg_auth | combine(_kc_item) }}"
  loop: "{{ keycloak_cfg_realms }}"
  loop_control:
    loop_var: _kc_item
    label: "{{ _kc_item.realm | default(_kc_item.id) | default('realm') }}"
  no_log: "{{ keycloak_cfg_no_log }}"

- name: Manage groups
  community.general.keycloak_group:
  args: "{{ _keycloak_cfg_auth | combine(_kc_item) }}"
  loop: "{{ keycloak_cfg_groups }}"
  loop_control:
    loop_var: _kc_item
    label: "{{ _kc_item.realm | default('realm') }} / {{ _kc_item.name | default('group') }}"
  no_log: "{{ keycloak_cfg_no_log }}"

- name: Manage clients
  community.general.keycloak_client:
  args: "{{ _keycloak_cfg_auth | combine(_kc_item) }}"
  loop: "{{ keycloak_cfg_clients }}"
  loop_control:
    loop_var: _kc_item
    label: "{{ _kc_item.realm | default('realm') }} / {{ _kc_item.client_id | default('client') }}"
  no_log: "{{ keycloak_cfg_no_log }}"

- name: Manage identity providers (and their mappers)
  community.general.keycloak_identity_provider:
  args: "{{ _keycloak_cfg_auth | combine(_kc_item) }}"
  loop: "{{ keycloak_cfg_identity_providers }}"
  loop_control:
    loop_var: _kc_item
    label: "{{ _kc_item.realm | default('realm') }} / {{ _kc_item.alias | default('idp') }}"
  no_log: "{{ keycloak_cfg_no_log }}"

- name: Manage realm keys
  community.general.keycloak_realm_key:
  args: "{{ _keycloak_cfg_auth | combine(_kc_item) }}"
  loop: "{{ keycloak_cfg_realm_keys }}"
  loop_control:
    loop_var: _kc_item
    label: "{{ _kc_item.parent_id | default('realm') }} / {{ _kc_item.name | default('key') }}"
  no_log: "{{ keycloak_cfg_no_log }}"

# Declarative user profile. On Keycloak 24+ the effective profile is served by
# the dedicated /admin/realms/{realm}/users/profile endpoint, NOT the /components
# API that community.general.keycloak_userprofile writes to — on KC 26 that module
# silently creates ignored duplicate components and never updates the live profile.
# So manage it directly over REST: token -> GET current -> PUT only when it differs.
- name: Get an admin token for the user-profile API
  ansible.builtin.uri:
    url: "{{ keycloak_cfg_url }}/realms/{{ keycloak_cfg_admin_realm }}/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: "{{ keycloak_cfg_admin_client_id }}"
      username: "{{ keycloak_cfg_admin_user }}"
      password: "{{ keycloak_cfg_admin_password }}"
    validate_certs: "{{ keycloak_cfg_validate_certs }}"
  register: _keycloak_cfg_token
  when: keycloak_cfg_user_profiles | length > 0
  check_mode: false
  no_log: "{{ keycloak_cfg_no_log }}"

- name: Fetch the current realm user profiles
  ansible.builtin.uri:
    url: "{{ keycloak_cfg_url }}/admin/realms/{{ _kc_item.realm }}/users/profile"
    method: GET
    headers:
      Authorization: "Bearer {{ _keycloak_cfg_token.json.access_token }}"
    validate_certs: "{{ keycloak_cfg_validate_certs }}"
  loop: "{{ keycloak_cfg_user_profiles }}"
  loop_control:
    loop_var: _kc_item
    label: "{{ _kc_item.realm }}"
  register: _keycloak_cfg_profile_current
  check_mode: false
  no_log: "{{ keycloak_cfg_no_log }}"

- name: Manage realm user profiles
  ansible.builtin.uri:
    url: "{{ keycloak_cfg_url }}/admin/realms/{{ _kc_res._kc_item.realm }}/users/profile"
    method: PUT
    headers:
      Authorization: "Bearer {{ _keycloak_cfg_token.json.access_token }}"
    body_format: json
    body: "{{ _kc_res._kc_item.profile }}"
    status_code: [200, 204]
    validate_certs: "{{ keycloak_cfg_validate_certs }}"
  # Loop over the GET results; each carries its source item under `_kc_item`
  # (the fetch task's loop_var) and the live profile under `json`.
  loop: "{{ _keycloak_cfg_profile_current.results }}"
  loop_control:
    loop_var: _kc_res
    label: "{{ _kc_res._kc_item.realm }}"
  # Idempotent: only PUT when the live profile differs from the declared one.
  when: _kc_res.json != _kc_res._kc_item.profile
  changed_when: true
  no_log: "{{ keycloak_cfg_no_log }}"
