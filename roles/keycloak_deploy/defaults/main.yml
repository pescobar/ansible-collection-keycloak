---
# defaults file for ansible-role-keycloak

# ----------------------------------------------------------------------------
# Deployment location
# ----------------------------------------------------------------------------
# Directory on the target host where the compose project, Caddyfile and the
# generated .env file are rendered.
keycloak_deploy_dir: /opt/keycloak

# User/group that should own the rendered files. Must already exist.
keycloak_deploy_user: root
keycloak_deploy_group: root

# Name of the docker compose project (prefixes container/volume/network names).
keycloak_deploy_project_name: keycloak

# ----------------------------------------------------------------------------
# Container images
# ----------------------------------------------------------------------------
# Official Keycloak image. Docker Hub mirrors the canonical quay.io image.
keycloak_deploy_image: quay.io/keycloak/keycloak
keycloak_deploy_version: "26.6.2-2"

# Official Caddy image used as the TLS-terminating reverse proxy.
keycloak_deploy_caddy_image: caddy
keycloak_deploy_caddy_version: "2"

# Official PostgreSQL image backing Keycloak in production mode.
# The "18" tag always tracks the latest stable PostgreSQL 18.x release.
keycloak_deploy_postgres_image: postgres
keycloak_deploy_postgres_version: "18"

# ----------------------------------------------------------------------------
# Public hostname / TLS (Caddy automatic HTTPS via Let's Encrypt)
# ----------------------------------------------------------------------------
# REQUIRED. The public FQDN Keycloak is served on. Caddy provisions a
# Let's Encrypt certificate for this name, so it must resolve publicly to
# this host and ports 80 + 443 must be reachable from the internet.
keycloak_deploy_hostname: "auth.example.com"

# OPTIONAL. A separate public FQDN to serve the Keycloak admin console on.
# When set (non-empty), the role:
#   - sets KC_HOSTNAME_ADMIN=https://<this> so Keycloak emits admin URLs on it
#     and the admin console is reachable only via this hostname;
#   - configures Caddy to also serve this domain and provision a Let's Encrypt
#     certificate for it.
# Like keycloak_deploy_hostname, it must resolve publicly to this host. Leave empty to
# serve the admin console on the main keycloak_deploy_hostname.
keycloak_deploy_admin_hostname: ""

# OPTIONAL. Restrict who may reach the admin hostname at the Caddy edge by
# source IP. Accepts a single CIDR/IP as a string, or a list of them. Only
# applies when keycloak_deploy_admin_hostname is set; clients outside the subnet(s)
# get a 403 from Caddy before the request ever reaches Keycloak. Empty means
# no IP restriction. Examples:
#   keycloak_deploy_admin_hostname_allowed_ips: "10.0.0.0/8"
#   keycloak_deploy_admin_hostname_allowed_ips:
#     - "10.0.0.0/8"
#     - "192.168.1.0/24"
#     - "203.0.113.42"
keycloak_deploy_admin_hostname_allowed_ips: []

# Email registered with the ACME (Let's Encrypt) account for expiry notices.
keycloak_deploy_acme_email: "admin@example.com"

# Set to "https://acme-staging-v02.api.letsencrypt.org/directory" while
# testing to avoid hitting Let's Encrypt production rate limits. Leave empty
# to use the Let's Encrypt production CA.
keycloak_deploy_acme_ca: ""

# Host ports Caddy binds. 80 is required for the ACME HTTP challenge / redirect.
keycloak_deploy_http_port: 80
keycloak_deploy_https_port: 443

# ----------------------------------------------------------------------------
# Keycloak admin bootstrap (Keycloak 26+ temporary admin)
# ----------------------------------------------------------------------------
# Create a strong password (e.g. with `openssl rand -base64 24`) and supply it
# via group_vars/vault rather than committing it. This bootstraps the first
# admin; rotate/replace it from the admin console afterwards.
keycloak_deploy_admin_user: admin
keycloak_deploy_admin_password: "changeme-admin"

# ----------------------------------------------------------------------------
# PostgreSQL
# ----------------------------------------------------------------------------
keycloak_deploy_db_name: keycloak
keycloak_deploy_db_user: keycloak
keycloak_deploy_db_password: "changeme-db"

# ----------------------------------------------------------------------------
# Keycloak runtime tuning
# ----------------------------------------------------------------------------
# Extra raw environment variables (key: value) injected verbatim into the
# Keycloak container, e.g. {KC_LOG_LEVEL: INFO}. Use this for any server option
# this role does not template directly.
#
# Naming convention: every Keycloak server option has an environment-variable
# form. Take the CLI option, drop the leading "--", uppercase it, replace "-"
# with "_" and prefix with "KC_". For example --log-level -> KC_LOG_LEVEL,
# --spi-connections-http-client-default-connection-pool-size ->
# KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_CONNECTION_POOL_SIZE.
#
# Authoritative, complete and version-specific lists of every accepted option:
#   - All server options (searchable):  https://www.keycloak.org/server/all-config
#   - Configuring Keycloak (concepts):  https://www.keycloak.org/server/configuration
#   - Per-area guides:
#       Hostname / proxy ...... https://www.keycloak.org/server/hostname
#                               https://www.keycloak.org/server/reverseproxy
#       Database .............. https://www.keycloak.org/server/db
#       TLS ................... https://www.keycloak.org/server/enabletls
#       Caching / clustering .. https://www.keycloak.org/server/caching
#       Logging ............... https://www.keycloak.org/server/logging
#       Health & metrics ...... https://www.keycloak.org/server/health
#       Hardening (prod) ...... https://www.keycloak.org/server/configuration-production
#       Importing realms ...... https://www.keycloak.org/server/importExport
#
# NOTE: To match the exact options for the image tag you deploy, the in-image
# list is the source of truth: `docker run --rm <image>:<tag> show-config`
# or `... help all`.
#
# Frequently used options (commented examples — uncomment in your own vars):
# keycloak_deploy_extra_env:
#   # --- Logging / observability ---
#   KC_LOG_LEVEL: INFO                 # root log level (e.g. INFO, DEBUG, WARN)
#   KC_LOG: "console,file"             # log handlers to enable
#   KC_LOG_CONSOLE_OUTPUT: json        # "default" or "json" structured logs
#   # --- Localization / theming ---
#   KC_SPI_THEME_WELCOME_THEME: keycloak
#   # --- Features (comma-separated) ---
#   KC_FEATURES: "token-exchange,admin-fine-grained-authz"
#   KC_FEATURES_DISABLED: "impersonation"
#   # --- HTTP / hostname extras (most are set by this role already) ---
#   # For a separate admin console URL use the keycloak_deploy_admin_hostname variable
#   # instead of setting KC_HOSTNAME_ADMIN here.
#   KC_HTTP_RELATIVE_PATH: "/auth"     # serve under a sub-path
#   # --- Database connection pool ---
#   KC_DB_POOL_INITIAL_SIZE: "5"
#   KC_DB_POOL_MAX_SIZE: "20"
#   # --- Realm import on first start (mount the file via keycloak_deploy_extra_env
#   #     plus your own volume) ---
#   KC_SPI_ADMIN_REALM: master
#
# WARNING: do not override keys this role already manages via the templated
# environment, or you will get duplicate/conflicting values. Reserved keys:
#   KC_DB, KC_DB_URL_HOST, KC_DB_URL_DATABASE, KC_DB_USERNAME, KC_DB_PASSWORD,
#   KC_HOSTNAME, KC_HOSTNAME_ADMIN (when keycloak_deploy_admin_hostname is set),
#   KC_HTTP_ENABLED, KC_PROXY_HEADERS, KC_HEALTH_ENABLED, KC_METRICS_ENABLED,
#   KC_BOOTSTRAP_ADMIN_USERNAME, KC_BOOTSTRAP_ADMIN_PASSWORD
keycloak_deploy_extra_env: {}

# Pull policy passed to docker compose ("missing", "always", "never").
keycloak_deploy_image_pull_policy: missing
