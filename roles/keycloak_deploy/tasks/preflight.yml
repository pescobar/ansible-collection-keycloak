---
# Verify Docker is present and usable. This role does NOT install Docker;
# Docker Engine + the Compose v2 plugin are expected to be installed already.
# `docker version` fails without the CLI or without a reachable daemon;
# `docker compose version` fails without the Compose v2 plugin.

- name: Probe Docker Engine and the Compose v2 plugin
  ansible.builtin.command: "{{ item }}"
  loop:
    - docker version
    - docker compose version
  register: _keycloak_deploy_docker
  changed_when: false
  failed_when: false

- name: Fail unless Docker Engine and Compose v2 are usable
  ansible.builtin.assert:
    that: _keycloak_deploy_docker.results | rejectattr('rc', 'eq', 0) | list | length == 0
    fail_msg: >-
      '{{ _keycloak_deploy_docker.results | rejectattr('rc', 'eq', 0) | map(attribute='item') | join("' and '") }}'
      failed on {{ inventory_hostname }}. This role requires Docker Engine (with
      a running daemon the connecting user can reach) and the Compose v2 plugin
      ('docker compose'; the legacy 'docker-compose' binary is not used),
      installed beforehand, e.g. via the geerlingguy.docker role or your distro
      packages.
    quiet: true
